name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          shopt -s nullglob
          for f in *.html; do cp "$f" _site/; done
          cp -r css data content blog CNAME _site/ 2>/dev/null || true
          cp -f robots.txt sitemap.xml llms.txt llms-full.txt og.png _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    # Proves the deployed site actually serves every regulator's brief, not just
    # that the files exist in the repo. Non-blocking: a Pages propagation delay is
    # not a content failure, and re-running the check is one click.
    if: github.ref_name == 'main'
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Pages propagation
        run: sleep 30

      - name: Live per-regulator publication check
        run: python3 tests/test_live.py
